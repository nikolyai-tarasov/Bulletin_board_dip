version: '3.9'

services:
  web:
    container_name: bulletin_board
    build: .
    command: >
      bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      - DEBUG=False
    volumes:
      - .:/code
      - static_volume:/code/static
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    container_name: db
    image: postgres:16
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - "5432:5432"

    env_file:
      - .env

    environment:
      - POSTGRES_USER=${USER}
      - POSTGRES_DB=${NAME}
      - POSTGRES_PASSWORD=${PASSWORD}

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${USER} -d ${NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  static_volume:
